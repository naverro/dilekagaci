<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Yönetim · Dilek Ağacı</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<script>
  // DESIGN.md (Arboreal Reverie) token'ları
  tailwind.config = {
    theme: { extend: {
      fontFamily: { sans: ['Manrope', 'sans-serif'], serif: ['Newsreader', 'serif'] },
      colors: {
        canvas: '#FDFBF7', low: '#F9F4EB', mid: '#F4EAD4', high: '#EFE2BA',
        canopy: '#2D5A27', deep: '#1E3F20', sprout: '#88B04B', bark: '#8A5A36', pebble: '#5D574F',
        carmine: '#D95A53', amber: '#E5A93C',
      },
      boxShadow: {
        rest: '0px 4px 16px -2px rgba(45,90,39,.05), 0px 1px 3px 0px rgba(138,90,54,.08)',
        lift: '0px 12px 28px -4px rgba(30,63,32,.08), 0px 4px 8px -2px rgba(138,90,54,.06)',
      },
    } },
  };
</script>
<style>
  body { background: #FDFBF7; }
  :focus-visible { outline: 2px solid #4E8752; outline-offset: 2px; }
</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌳%3C/text%3E%3C/svg%3E">
</head>
<body class="font-sans text-pebble min-h-screen">
<main class="max-w-[720px] mx-auto px-5 py-8">

  <header class="flex items-start justify-between gap-4 mb-6">
    <div>
      <h1 class="font-serif text-3xl text-deep leading-tight">Dilek Ağacı yönetimi</h1>
      <p class="text-sm mt-1" id="whoami">Giriş gerekli</p>
    </div>
    <button id="logoutBtn" class="hidden h-10 px-4 rounded-xl border border-bark/20 bg-mid text-canopy text-sm font-semibold hover:bg-high transition-colors" type="button">Çıkış yap</button>
  </header>

  <!-- Giriş -->
  <section id="loginView" class="hidden bg-mid border border-high rounded-2xl p-6 shadow-rest">
    <h2 class="font-serif text-xl text-deep mb-4">Yönetici girişi</h2>
    <form id="loginForm" class="space-y-3">
      <div>
        <label class="block text-xs font-semibold mb-1" for="email">E-posta</label>
        <input id="email" type="email" autocomplete="username" required class="w-full rounded-lg bg-canvas border-high focus:border-[#4E8752] focus:ring-[#4E8752]/20">
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1" for="password">Şifre</label>
        <input id="password" type="password" autocomplete="current-password" required class="w-full rounded-lg bg-canvas border-high focus:border-[#4E8752] focus:ring-[#4E8752]/20">
      </div>
      <p id="loginError" class="hidden text-sm rounded-lg px-3 py-2 bg-red-50 text-red-800 border border-red-200" role="alert"></p>
      <button id="loginBtn" class="h-12 w-full rounded-xl bg-canopy text-canvas font-semibold hover:bg-deep active:bg-deep transition-colors disabled:opacity-60" type="submit">Giriş yap</button>
    </form>
  </section>

  <!-- Panel -->
  <section id="dashView" class="hidden space-y-6">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="stats">
      <div class="bg-mid border border-high rounded-2xl p-4 shadow-rest"><p class="text-xs">Toplam</p><p class="font-serif text-3xl text-deep" data-stat="total">–</p></div>
      <div class="bg-mid border border-high rounded-2xl p-4 shadow-rest"><p class="text-xs">Onay bekleyen</p><p class="font-serif text-3xl text-amber" data-stat="pending">–</p></div>
      <div class="bg-mid border border-high rounded-2xl p-4 shadow-rest"><p class="text-xs">Onaylanmış</p><p class="font-serif text-3xl text-canopy" data-stat="approved">–</p></div>
      <div class="bg-mid border border-high rounded-2xl p-4 shadow-rest"><p class="text-xs">Reddedilmiş</p><p class="font-serif text-3xl text-carmine" data-stat="rejected">–</p></div>
    </div>

    <div class="bg-low border border-high rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
      <div>
        <p class="text-sm font-semibold text-deep">Yeni dilekler</p>
        <p class="text-xs" id="modeHint"></p>
      </div>
      <select id="modeSelect" class="rounded-lg bg-canvas border-high text-sm focus:border-[#4E8752] focus:ring-[#4E8752]/20" aria-label="Yeni dilekler için moderasyon">
        <option value="auto">Otomatik onay (şüpheliler onaya düşer)</option>
        <option value="manual">Manuel onay (hepsi onaya düşer)</option>
      </select>
    </div>

    <div>
      <div class="flex items-center justify-between gap-3 mb-3">
        <div class="flex gap-2" role="tablist" id="tabs">
          <button role="tab" data-status="pending"  class="tab h-9 px-4 rounded-full text-sm font-semibold border border-bark/20" type="button">Bekleyen</button>
          <button role="tab" data-status="approved" class="tab h-9 px-4 rounded-full text-sm font-semibold border border-bark/20" type="button">Onaylı</button>
          <button role="tab" data-status="rejected" class="tab h-9 px-4 rounded-full text-sm font-semibold border border-bark/20" type="button">Reddedilen</button>
        </div>
        <button id="refreshBtn" class="h-9 px-3 rounded-full text-sm text-canopy hover:bg-mid/60" type="button">Yenile</button>
      </div>
      <p id="listError" class="hidden text-sm rounded-lg px-3 py-2 mb-3 bg-red-50 text-red-800 border border-red-200" role="alert"></p>
      <ul id="list" class="space-y-3"></ul>
      <p id="empty" class="hidden text-center text-sm py-8">Bu listede dilek yok.</p>
      <button id="moreBtn" class="hidden mt-4 mx-auto block h-10 px-5 rounded-xl border border-bark/20 bg-mid text-canopy text-sm font-semibold hover:bg-high" type="button">Daha fazla göster</button>
    </div>
  </section>

  <div id="captchaBox" class="fixed left-1/2 -translate-x-1/2 bottom-3 z-50"></div>
</main>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script type="module" src="/js/admin.js"></script>
</body>
</html>
