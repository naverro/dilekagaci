<!DOCTYPE html><html lang="tr"><head>

<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif'],
            newsreader: ['"Newsreader"', 'serif'],
            handwriting: ['"Caveat"', 'cursive'],
          },
          colors: {
            nature: {
              50: '#f4f8f4',
              100: '#e5efe5',
              200: '#cce2cd',
              500: '#2e6b37',
              600: '#23562b',
              700: '#1b4322',
              800: '#15361b',
              900: '#0e2412',
            }
          },
          animation: {
            'sway-slow': 'sway 4.2s ease-in-out infinite alternate',
            'sway-fast': 'sway 2.8s ease-in-out infinite alternate',
            'sway-mid': 'sway 3.5s ease-in-out infinite alternate-reverse',
            'sway-wide': 'swayWide 4.8s ease-in-out infinite alternate',
          },
          keyframes: {
            sway: {
              '0%': { transform: 'rotate(-4deg) translateY(0px)' },
              '100%': { transform: 'rotate(5deg) translateY(2px)' },
            },
            swayWide: {
              '0%': { transform: 'rotate(-6deg) translateY(0px)' },
              '100%': { transform: 'rotate(6deg) translateY(3px)' },
            }
          }
        }
      }
    };
  </script>
<style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      background: radial-gradient(circle at 50% 25%, #ffffff 0%, #f6f8f5 55%, #edf3eb 100%);
    }

    .ribbon {
      transform-origin: top center;
      cursor: pointer;
      transition: filter 0.25s ease, transform 0.25s ease;
    }
    .ribbon:hover {
      filter: brightness(1.18) drop-shadow(0 4px 10px rgba(0,0,0,0.32));
    }

    /* Paper texture for wish notes */
    .kraft-paper {
      background: radial-gradient(circle at 15% 15%, #fdfbf7 0%, #f7eedb 45%, #efe2c8 100%);
      box-shadow: 0 25px 50px -12px rgba(28, 40, 25, 0.25), 0 0 0 1px rgba(180, 140, 90, 0.25);
    }

    /* Leaf wind particles */
    .leaf-wind {
      pointer-events: none;
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 10;
    }
    .falling-leaf {
      position: absolute;
      top: -24px;
      opacity: 0.55;
      animation: fallDown linear infinite;
    }
    @keyframes fallDown {
      0% {
        transform: translate(0, 0) rotate(0deg);
        opacity: 0;
      }
      12% { opacity: 0.65; }
      88% { opacity: 0.65; }
      100% {
        transform: translate(90px, 92vh) rotate(380deg);
        opacity: 0;
      }
    }
  </style>

<style>
    /* --- işlevsellik için eklenenler (görsel kimliği değiştirmez) --- */
    .ribbon:focus-visible { outline: 2px solid #23562b; outline-offset: 3px; }
    .ribbon-slot.is-new { animation: ribbonIn 0.8s ease-out both; }
    @keyframes ribbonIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
    #captchaBox { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 60; }
    @media (prefers-reduced-motion: reduce) {
      .ribbon, .falling-leaf, .ribbon-slot.is-new, .animate-ping, .animate-pulse, .animate-spin { animation: none !important; }
      .leaf-wind { display: none; }
    }
  </style>
</head>
