<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dilek Ağacı</title>
<meta name="description" content="Bir dilek bırak, başkasının dileğini çek, kurdele at.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌳</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #f6d98c;
    --gold-deep: #e3b955;
    --ribbon: #e0475b;
    --paper: #fbf3e0;
    --ink: #4a3523;
    --text: #eaf4ee;
    --muted: #a8c4b5;
    --panel: rgba(255, 255, 255, .07);
    --line: rgba(255, 255, 255, .14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh;
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 520px at 50% -8%, #2b5a48 0%, transparent 62%),
      linear-gradient(#0b1a17, #10281f 65%, #0b1a17);
    background-attachment: fixed;
    overflow-x: hidden;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  /* ışık böcekleri */
  .fireflies { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .fireflies span {
    position: absolute; width: 5px; height: 5px; border-radius: 50%;
    background: var(--gold); box-shadow: 0 0 10px 3px rgba(246, 217, 140, .6);
    opacity: 0; animation: glow var(--t, 6s) ease-in-out var(--d, 0s) infinite;
  }
  @keyframes glow {
    0%, 100% { opacity: 0; transform: translate(0, 0); }
    50% { opacity: .9; transform: translate(var(--x, 12px), var(--y, -18px)); }
  }

  main { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 28px 18px 48px; }

  header { text-align: center; }
  h1 {
    font-family: "Fraunces", Georgia, serif; font-weight: 600;
    font-size: clamp(2rem, 7vw, 2.8rem); margin: 0 0 6px; letter-spacing: .5px;
    color: var(--gold);
  }
  .sub { margin: 0; color: var(--muted); }

  .tree { display: block; width: min(340px, 82vw); height: auto; margin: 10px auto 0; filter: drop-shadow(0 10px 30px rgba(0, 0, 0, .35)); }
  .sway { transform-box: fill-box; transform-origin: 50% 0; animation: sway 3.8s ease-in-out var(--d, 0s) infinite alternate; }
  @keyframes sway { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }

  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
    padding: 20px; margin-top: 18px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .panel h2 { margin: 0 0 12px; font-size: 1.05rem; color: var(--gold); }

  textarea {
    width: 100%; min-height: 110px; resize: vertical; padding: 14px;
    border-radius: 14px; border: 1px solid var(--line); background: rgba(0, 0, 0, .28);
    color: var(--text); font: 500 1.35rem/1.35 "Caveat", "Segoe Print", cursive;
  }
  textarea::placeholder { color: #86a597; }
  textarea:focus-visible, .btn:focus-visible, .ribbon-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  .count { color: var(--muted); font-size: .85rem; }
  .count.warn { color: #ffb3bd; }

  .btn {
    appearance: none; border: 0; cursor: pointer; font: 700 1rem "Nunito", sans-serif;
    padding: 12px 20px; border-radius: 999px; color: #2a1d0e;
    background: linear-gradient(180deg, var(--gold), var(--gold-deep));
    box-shadow: 0 6px 18px rgba(227, 185, 85, .25); transition: transform .15s, filter .15s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.05); }
  .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .btn.ghost { background: transparent; color: var(--gold); border: 1px solid var(--gold); box-shadow: none; }
  .btn.wide { width: 100%; }

  .hint { margin: 10px 0 0; color: var(--muted); font-size: .9rem; }

  /* çekilen dilek: ipten sarkan kâğıt etiket */
  .tag-wrap { display: flex; justify-content: center; margin-top: 8px; }
  .tag {
    position: relative; width: 100%; background: var(--paper); color: var(--ink);
    border-radius: 6px 6px 16px 16px; padding: 30px 22px 18px; margin-top: 46px;
    transform-origin: 50% -46px; box-shadow: 0 14px 30px rgba(0, 0, 0, .35);
    animation: swing 1.1s ease-out;
  }
  .tag::before { /* ip */
    content: ""; position: absolute; left: 50%; top: -46px; width: 2px; height: 46px;
    background: #d9c79a; transform: translateX(-50%);
  }
  .tag::after { /* delik */
    content: ""; position: absolute; left: 50%; top: 10px; width: 12px; height: 12px;
    border-radius: 50%; background: #2a1d0e; opacity: .55; transform: translateX(-50%);
  }
  @keyframes swing {
    0% { transform: rotate(-7deg); } 25% { transform: rotate(5deg); }
    50% { transform: rotate(-3deg); } 75% { transform: rotate(1.5deg); } 100% { transform: rotate(0); }
  }
  .wish-text {
    font: 700 1.85rem/1.25 "Caveat", "Segoe Print", cursive; margin: 0; text-align: center;
    overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .tag-actions { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
  .ribbon-btn {
    appearance: none; cursor: pointer; border: 2px solid var(--ribbon); background: transparent; color: var(--ribbon);
    font: 700 1rem "Nunito", sans-serif; padding: 9px 16px; border-radius: 999px; transition: transform .15s, background .15s, color .15s;
  }
  .ribbon-btn:hover:not(:disabled) { transform: scale(1.04); }
  .ribbon-btn.done, .ribbon-btn:disabled { background: var(--ribbon); color: #fff; cursor: default; }
  .ribbon-btn.pop { animation: pop .45s ease; }
  @keyframes pop { 40% { transform: scale(1.25) rotate(-8deg); } }

  .empty { text-align: center; color: var(--muted); margin: 6px 0 0; }

  #status { min-height: 1.4em; margin: 14px 0 0; text-align: center; font-weight: 600; color: var(--gold); }
  #status.error { color: #ffb3bd; }

  footer { text-align: center; color: #6f8f80; font-size: .8rem; margin-top: 28px; }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .sway, .fireflies span, .tag, .ribbon-btn.pop { animation: none; }
    .fireflies span { opacity: .5; }
  }
</style>
</head>
<body>
<div class="fireflies" id="fireflies" aria-hidden="true"></div>

<main>
  <header>
    <h1>Dilek Ağacı</h1>
    <p class="sub">Bir dilek bırak, başkasının dileğini çek, kurdele at.</p>
  </header>

  <svg class="tree" viewBox="0 0 400 400" role="img" aria-label="Kurdelelerle süslenmiş dilek ağacı">
    <defs>
      <radialGradient id="leaf" cx="40%" cy="35%" r="75%">
        <stop offset="0" stop-color="#6fbf8b"/><stop offset="1" stop-color="#245a42"/>
      </radialGradient>
      <linearGradient id="bark" x1="0" x2="1">
        <stop offset="0" stop-color="#6a4730"/><stop offset="1" stop-color="#3b2819"/>
      </linearGradient>
      <g id="rb">
        <path d="M0 0V16" stroke="#e8d9a8" stroke-width="1.2" fill="none"/>
        <path d="M0 16 -6 34 0 29 6 34Z"/>
        <circle cy="16" r="4.2"/>
      </g>
    </defs>

    <ellipse cx="200" cy="390" rx="120" ry="8" fill="#000" opacity=".25"/>
    <path d="M184 390 C190 330 186 290 178 250 C152 236 130 216 114 192 C132 206 158 220 183 228 C187 200 185 182 181 160 L219 160 C215 182 213 200 217 228 C242 220 268 206 286 192 C270 216 248 236 222 250 C214 290 210 330 216 390Z" fill="url(#bark)"/>

    <g fill="url(#leaf)">
      <circle cx="200" cy="118" r="78"/>
      <circle cx="140" cy="150" r="62" opacity=".95"/>
      <circle cx="262" cy="150" r="62" opacity=".95"/>
      <circle cx="104" cy="200" r="46" opacity=".9"/>
      <circle cx="298" cy="200" r="46" opacity=".9"/>
      <circle cx="168" cy="204" r="60"/>
      <circle cx="234" cy="204" r="60"/>
      <circle cx="200" cy="165" r="72"/>
    </g>

    <g>
      <use class="sway" style="--d:0s"   href="#rb" x="130" y="172" fill="#e0475b"/>
      <use class="sway" style="--d:-1.2s" href="#rb" x="178" y="218" fill="#f6d98c"/>
      <use class="sway" style="--d:-2.1s" href="#rb" x="226" y="226" fill="#e0475b"/>
      <use class="sway" style="--d:-.6s"  href="#rb" x="272" y="176" fill="#f2a6b8"/>
      <use class="sway" style="--d:-1.8s" href="#rb" x="200" y="178" fill="#f6d98c"/>
      <use class="sway" style="--d:-2.6s" href="#rb" x="92"  y="212" fill="#f2a6b8"/>
      <use class="sway" style="--d:-.9s"  href="#rb" x="312" y="212" fill="#f6d98c"/>
      <use class="sway" style="--d:-1.5s" href="#rb" x="152" y="124" fill="#f6d98c"/>
      <use class="sway" style="--d:-2.3s" href="#rb" x="252" y="122" fill="#f2a6b8"/>
    </g>
  </svg>

  <section class="panel" aria-labelledby="write-title">
    <h2 id="write-title">Dileğini yaz</h2>
    <form id="wishForm">
      <label for="wishInput" class="sr-only" style="position:absolute;left:-9999px">Dileğin</label>
      <textarea id="wishInput" maxlength="200" placeholder="Aklından ne geçiyor?" required></textarea>
      <div class="row">
        <span class="count" id="count">0 / 200</span>
        <button class="btn" id="submitBtn" type="submit">Dileği Ağaca As 🌳</button>
      </div>
    </form>
  </section>

  <section class="panel" aria-labelledby="draw-title">
    <h2 id="draw-title">Bir dilek çek</h2>
    <button class="btn wide" id="drawBtn" type="button" disabled>Dilek Çek ✨</button>
    <p class="hint" id="lockHint">Önce kendi dileğini bırak, sonra başkasının dileğini çekebilirsin.</p>

    <div id="result" hidden>
      <div class="tag-wrap">
        <article class="tag" id="tag">
          <p class="wish-text" id="wishText"></p>
          <div class="tag-actions">
            <button class="ribbon-btn" id="ribbonBtn" type="button" aria-label="Bu dileğe kurdele at">
              🎀 <span id="ribbonLabel">Kurdele at</span> · <span id="ribbonCount">0</span>
            </button>
          </div>
        </article>
      </div>
    </div>
    <p class="empty" id="emptyMsg" hidden>Ağaç şimdilik sessiz… Dilekler geldikçe burada olacak. 🌙</p>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
  <footer>Dilekler anonimdir. Nazik kal, güzel dile. 💚</footer>
</main>

<script>
(() => {
  "use strict";
  const API = "/api/wishes";
  const MAX = 200;
  const $ = (s) => document.querySelector(s);

  // --- tarayıcı depolama (özel modda hata verirse bellekte tut) ---
  const mem = {};
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return mem[k] ?? null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { mem[k] = v; } }
  };
  const readJSON = (k, fallback) => { try { return JSON.parse(store.get(k)) ?? fallback; } catch { return fallback; } };
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
    : "u" + Math.random().toString(36).slice(2) + Date.now().toString(36));

  let authorId = store.get("authorId");
  if (!authorId) { authorId = uuid(); store.set("authorId", authorId); }
  let hasWished = store.get("hasWished") === "1";
  const ribboned = new Set(readJSON("ribboned", []));
  let current = null; // şu an gösterilen dilek

  // --- elemanlar ---
  const form = $("#wishForm"), input = $("#wishInput"), count = $("#count");
  const submitBtn = $("#submitBtn"), drawBtn = $("#drawBtn"), lockHint = $("#lockHint");
  const result = $("#result"), tag = $("#tag"), wishText = $("#wishText");
  const ribbonBtn = $("#ribbonBtn"), ribbonCount = $("#ribbonCount"), ribbonLabel = $("#ribbonLabel");
  const emptyMsg = $("#emptyMsg"), statusEl = $("#status");

  function say(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.classList.toggle("error", isError);
  }

  async function api(path, options) {
    const res = await fetch(API + path, {
      headers: { "Content-Type": "application/json" },
      ...options
    });
    let data = null;
    try { data = await res.json(); } catch { /* boş gövde */ }
    return { ok: res.ok, status: res.status, data };
  }

  function syncDrawState() {
    drawBtn.disabled = !hasWished;
    lockHint.hidden = hasWished;
  }

  // --- karakter sayacı ---
  input.addEventListener("input", () => {
    const n = input.value.length;
    count.textContent = `${n} / ${MAX}`;
    count.classList.toggle("warn", n >= MAX - 20);
  });

  // --- dilek bırak ---
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return say("Önce bir dilek yaz 🌱", true);

    submitBtn.disabled = true;
    say("");
    try {
      const { ok, data } = await api("", { method: "POST", body: JSON.stringify({ text, authorId }) });
      if (!ok) return say((data && data.error) || "Dilek kaydedilemedi", true);

      input.value = "";
      count.textContent = `0 / ${MAX}`;
      hasWished = true;
      store.set("hasWished", "1");
      syncDrawState();
      say("Dileğin ağaca asıldı ✨ Şimdi başkasının dileğini çekebilirsin.");
    } catch {
      say("Bağlantı hatası, tekrar dene", true);
    } finally {
      submitBtn.disabled = false;
    }
  });

  // --- dilek çek ---
  function renderRibbon() {
    const done = current && ribboned.has(current.id);
    ribbonBtn.classList.toggle("done", !!done);
    ribbonBtn.disabled = !!done;
    ribbonLabel.textContent = done ? "Kurdele attın" : "Kurdele at";
    ribbonCount.textContent = current ? current.ribbonCount : 0;
  }

  drawBtn.addEventListener("click", async () => {
    drawBtn.disabled = true;
    say("");
    try {
      const { ok, status, data } = await api(`/random?authorId=${encodeURIComponent(authorId)}`);
      if (status === 404) {
        result.hidden = true;
        emptyMsg.hidden = false;
        current = null;
        return;
      }
      if (!ok) return say((data && data.error) || "Dilek çekilemedi", true);

      current = data;
      emptyMsg.hidden = true;
      wishText.textContent = data.text; // textContent: XSS'e karşı güvenli
      renderRibbon();
      result.hidden = false;
      tag.style.animation = "none"; void tag.offsetWidth; tag.style.animation = ""; // sallanmayı yeniden başlat
    } catch {
      say("Bağlantı hatası, tekrar dene", true);
    } finally {
      syncDrawState();
      if (result.hidden === false) drawBtn.textContent = "Başka Dilek Çek ✨";
    }
  });

  // --- kurdele at ---
  ribbonBtn.addEventListener("click", async () => {
    if (!current || ribboned.has(current.id)) return;
    ribbonBtn.disabled = true;
    try {
      const { ok, data } = await api(`/${current.id}/ribbon`, { method: "POST" });
      if (!ok) { ribbonBtn.disabled = false; return say((data && data.error) || "Kurdele atılamadı", true); }

      current.ribbonCount = data.ribbonCount;
      ribboned.add(current.id);
      store.set("ribboned", JSON.stringify([...ribboned]));
      renderRibbon();
      ribbonBtn.classList.add("pop");
      setTimeout(() => ribbonBtn.classList.remove("pop"), 500);
    } catch {
      ribbonBtn.disabled = false;
      say("Bağlantı hatası, tekrar dene", true);
    }
  });

  // --- ışık böcekleri ---
  const ff = $("#fireflies");
  for (let i = 0; i < 16; i++) {
    const s = document.createElement("span");
    s.style.left = Math.random() * 100 + "%";
    s.style.top = 15 + Math.random() * 80 + "%";
    s.style.setProperty("--t", 5 + Math.random() * 5 + "s");
    s.style.setProperty("--d", -Math.random() * 8 + "s");
    s.style.setProperty("--x", Math.random() * 30 - 15 + "px");
    s.style.setProperty("--y", -(8 + Math.random() * 24) + "px");
    ff.appendChild(s);
  }

  syncDrawState();
})();
</script>
</body>
</html>
